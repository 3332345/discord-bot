<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --primary: #ec4899;
            --primary-hover: #db2777;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard-container {
            width: 450px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        h1 span {
            color: var(--primary);
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .user-info {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .user-info p {
            margin-bottom: 8px;
            font-size: 13px;
        }

        .user-info p:last-child {
            margin-bottom: 0;
        }

        .logout-btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            transition: background-color 0.2s;
        }

        .logout-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>lilvape<span>.lol</span></h1>
        <p>Welcome to your dashboard</p>

        <div class="user-info" id="user-info">
            <p><strong>Username:</strong> <span id="username">Loading...</span></p>
            <p><strong>Discord ID:</strong> <span id="discord-id">Loading...</span></p>
        </div>

        <a href="/logout" class="logout-btn">Log Out</a>
    </div>

    <script>
        async function fetchUserData() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('username').textContent = data.username || 'Unknown';
                    document.getElementById('discord-id').textContent = data.discordId || 'Unknown';
                } else {
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Error fetching user data:', error);
            }
        }

        fetchUserData();
    </script>
</body>
</html>
